<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle App Icon Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Database Cylinders Stack -->
  <g filter="url(#glow)">
    <!-- Layer 3 (Bottom) -->
    <path d="M 140,320 v 50 c 0,26 52,48 116,48 s 116,-22 116,-48 v -50 c 0,26 -52,48 -116,48 s -116,-22 -116,-48 Z" fill="#93c5fd" opacity="0.9" />
    <ellipse cx="256" cy="320" rx="116" ry="40" fill="#bfdbfe" />

    <!-- Layer 2 (Middle) -->
    <path d="M 140,240 v 50 c 0,26 52,48 116,48 s 116,-22 116,-48 v -50 c 0,26 -52,48 -116,48 s -116,-22 -116,-48 Z" fill="#dbeafe" opacity="0.95" />
    <ellipse cx="256" cy="240" rx="116" ry="40" fill="#eff6ff" />

    <!-- Layer 1 (Top) -->
    <path d="M 140,160 v 50 c 0,26 52,48 116,48 s 116,-22 116,-48 v -50 c 0,26 -52,48 -116,48 s -116,-22 -116,-48 Z" fill="#ffffff" />
    <ellipse cx="256" cy="160" rx="116" ry="40" fill="url(#dbGrad)" stroke="#60a5fa" stroke-width="4" />
  </g>

  <!-- Decorative Ring Line on Top Cap -->
  <ellipse cx="256" cy="160" rx="84" ry="28" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 6" opacity="0.7" />

  <!-- AI Sparkles -->
  <g filter="url(#starGlow)">
    <!-- Big Star Top Right -->
    <path d="M 370,120 Q 370,160 410,160 Q 370,160 370,200 Q 370,160 330,160 Q 370,160 370,120 Z" fill="url(#sparkleGrad)" />
    <!-- Small Star Top Left -->
    <path d="M 130,100 Q 130,120 150,120 Q 130,120 130,140 Q 130,120 110,120 Q 130,120 130,100 Z" fill="url(#sparkleGrad)" />
    <!-- Mini Star Bottom Right -->
    <path d="M 390,360 Q 390,375 405,375 Q 390,375 390,390 Q 390,375 375,375 Q 390,375 390,360 Z" fill="url(#sparkleGrad)" />
  </g>
</svg>
